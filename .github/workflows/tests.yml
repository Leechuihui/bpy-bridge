name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12"]
        exclude:
          # ubuntu-latest has moved to 26.04, whose toolcache has no 3.8 build;
          # setup-python fails before a single test runs. Pin the oldest
          # supported interpreter to an image that still ships it rather than
          # dropping coverage for the version pyproject.toml still claims.
          - os: ubuntu-latest
            python: "3.8"
        include:
          - os: ubuntu-22.04
            python: "3.8"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify the server file is standalone
        # The whole point of server.py is that it can be copied into Blender and
        # exec()'d with no package around it. Importing it as a bare file, with
        # no site-packages and no sibling modules, is the cheapest way to prove
        # that claim stays true.
        run: python tests/standalone_server_check.py

      - name: End-to-end smoke test
        # Two real processes: a bridge with a fake bpy, driven by the installed
        # CLI. This is the step that catches packaging and exit-code regressions
        # that unit tests structurally cannot see.
        run: python tests/e2e_smoke.py

  docs:
    # Docs checks are OS- and Python-independent, so they run once instead of
    # nine times across the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check bilingual links, docs links, and image paths
        # Two conventions that fail silently on GitHub: a language switcher
        # pointing at a renamed file, and an image path that renders as a broken
        # icon. This makes both checked invariants.
        run: python tests/check_readme_links.py

      - name: "Check repo metadata: issue forms and placeholders"
        # Two real defects shipped here: issue templates that used the old
        # .md-template keys in .yml files (so GitHub read them as invalid forms
        # and the community profile reported issue_template MISSING with no
        # error pointing at the file), and a config.yml whose contact links
        # still pointed at YOUR-USER after everything else had been rewritten.
        # Both are metadata-only breakage -- tests stay green, the package
        # installs -- and the failure mode is that people cannot report things.
        run: |
          python -m pip install --quiet pyyaml
          python tests/check_repo_metadata.py

      - name: "Check docs images: size budget, animated GIF, and references"
        # Screenshots and the demo GIF are build artifacts. They cannot be
        # regenerated in CI -- that needs a live Blender -- but two failure modes
        # are worth failing on:
        #
        #   1. A 10 MB PNG committed by accident.
        #   2. A GIF that is not actually animated. This happened for real: the
        #      first orbit demo came out as eight near-identical frames (mean
        #      pixel difference 0.04-0.12) because bpy.ops.render.opengl defaults
        #      to view_context=True and was rendering the viewport instead of the
        #      scene camera. Nothing else in the suite would have caught it.
        #
        # The checks live in tests/check_docs_images.py rather than inline here so
        # that they run identically on a developer's machine.
        run: |
          python -m pip install --quiet pillow
          python tests/check_docs_images.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile every module
        run: python -m compileall -q bpy_bridge tests tools examples
      - name: Check the CLI entry point responds
        run: |
          python -m pip install -e .
          bpy-bridge --help > /dev/null
          bpy-bridge token-path
