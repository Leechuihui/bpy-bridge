name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify the server file is standalone
        # The whole point of server.py is that it can be copied into Blender and
        # exec()'d with no package around it. Importing it as a bare file, with
        # no site-packages and no sibling modules, is the cheapest way to prove
        # that claim stays true.
        run: python tests/standalone_server_check.py

      - name: End-to-end smoke test
        # Two real processes: a bridge with a fake bpy, driven by the installed
        # CLI. This is the step that catches packaging and exit-code regressions
        # that unit tests structurally cannot see.
        run: python tests/e2e_smoke.py

  docs:
    # Docs checks are OS- and Python-independent, so they run once instead of
    # nine times across the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check bilingual links, docs links, and image paths
        # Two conventions that fail silently on GitHub: a language switcher
        # pointing at a renamed file, and an image path that renders as a broken
        # icon. This makes both checked invariants.
        run: python tests/check_readme_links.py

      - name: Check docs images are present and not oversized
        # Screenshots are build artifacts (tools/render_terminal.py). They cannot
        # be regenerated in CI -- that needs a live Blender -- but committing a
        # 10 MB PNG is a mistake worth failing on.
        run: |
          python - <<'PY'
          import os
          import sys

          image_dir = "docs/images"
          if not os.path.isdir(image_dir):
              sys.exit("docs/images is missing")

          limit = 1_500_000
          problems = []
          total = 0
          for name in sorted(os.listdir(image_dir)):
              if not name.lower().endswith(".png"):
                  continue
              size = os.path.getsize(os.path.join(image_dir, name))
              total += size
              if size > limit:
                  problems.append("%s is %.1f MB (limit %.1f MB)"
                                  % (name, size / 1e6, limit / 1e6))
              print("%-30s %8.1f KB" % (name, size / 1024.0))

          print("total: %.1f MB" % (total / 1e6))
          if problems:
              for problem in problems:
                  print("FAIL:", problem)
              sys.exit(1)
          print("OK: all doc images within budget")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every module
        run: python -m compileall -q bpy_bridge tests tools examples
      - name: Check the CLI entry point responds
        run: |
          python -m pip install -e .
          bpy-bridge --help > /dev/null
          bpy-bridge token-path
