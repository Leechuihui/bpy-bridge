name: Feature request
description: Suggest a capability, or tell us what you are trying to do
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the goal, not the API you have in mind. "I want to run 40 seed
        variations without relaunching Blender" is more useful than
        "add a batch() method".

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Why the current approach does not work
      description: What have you tried? Was it slow, unreliable, or impossible?
    validations:
      required: true

  - type: textarea
    id: sketch
    attributes:
      label: Sketch of what you imagine
      description: Optional. A few lines of pretend client code are fine.
      render: python

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: |
        The project is deliberately small. It is worth confirming up front that
        the request fits.
      options:
        - label: This needs no new runtime dependency (both halves are dependency-free on purpose)
          required: true
        - label: This does not require sandboxing / module allowlists (that is a different project)
          required: true
        - label: This does not change the default bind address away from loopback
          required: true
